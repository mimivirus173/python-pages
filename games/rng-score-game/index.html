<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RNG Score Game</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>

<body>
    <div id="container">
        <h1>RNG Score Game</h1>

        <div class="scores-counter">
            <span id="id1">Score: <span id="score"></span></span>
            <span>High score: <span id="highscore"></span></span>
        </div>

        <p>Input a number between 0 and 100...</p>
        <input type="text" id="num_input" placeholder="0" />
        <button id="submit-button">Submit</button>
        <div id="output"></div>
    </div>
    <script type="py" src="./main.py" config="./pyscript.json"></script>
</body>

</html>
